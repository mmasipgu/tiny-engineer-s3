name: Build and publish Tiny Engineer S3 Web Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout installer repository
        uses: actions/checkout@v4

      - name: Checkout Tiny Engineer upstream
        uses: actions/checkout@v4
        with:
          repository: jamro/tiny-engineer
          ref: main
          path: upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio esptool

      - name: Apply ESP32-S3-N16R8 port
        run: |
          cp overlay/platformio.ini upstream/platformio.ini
          cp overlay/include/pins.h upstream/include/pins.h
          cp overlay/partitions_s3.csv upstream/partitions_s3.csv

      - name: Make PCA9685 optional
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("upstream/src/hardware/pca9685_servos.cpp")
          s = p.read_text(encoding="utf-8")

          replacement = r'''void initPca9685() {
            serialLogPrintln();
            serialLogPrintln("Checking PCA9685 at 0x40...");

            if (!pca9685Connected()) {
              serialLogPrintln("WARNING: PCA9685 not found at 0x40");
              serialLogPrintln("External S3 build: continuing without active servos");
              initServoPwmDriver();
              disableServoOutputs();
              return;
            }

            serialLogPrintln("PCA9685 found");
            initServoPwmDriver();
          }'''

          pattern = re.compile(
              r'void\s+initPca9685\s*\(\s*\)\s*\{.*?\n\}\s*\n\s*bool\s+moveServoSmooth',
              re.DOTALL
          )

          if not pattern.search(s):
              raise SystemExit("Could not locate initPca9685()")

          p.write_text(
              pattern.sub(replacement + "\n\nbool moveServoSmooth", s, count=1),
              encoding="utf-8"
          )
          PY

      - name: Enable runtime servo limits and OLED rotation
        run: |
          python overlay/patch_runtime_settings.py upstream

      - name: Build firmware
        working-directory: upstream
        run: |
          pio run -e esp32-s3-n16r8
          pio run -e esp32-s3-n16r8 -t buildfs

      - name: Assemble factory image
        shell: bash
        run: |
          set -euxo pipefail

          BUILD="upstream/.pio/build/esp32-s3-n16r8"
          BOOT_APP0="$(find "$HOME/.platformio/packages" -type f -name boot_app0.bin | head -n 1)"

          test -f "$BUILD/bootloader.bin"
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/firmware.bin"
          test -f "$BUILD/littlefs.bin"
          test -n "$BOOT_APP0"
          test -f "$BOOT_APP0"

          mkdir -p site/firmware

          python -m esptool --chip esp32s3 merge-bin \
            -o site/firmware/tiny-engineer-s3-n16r8.factory.bin \
            --flash-mode dio \
            --flash-freq 80m \
            --flash-size 16MB \
            0x000000 "$BUILD/bootloader.bin" \
            0x008000 "$BUILD/partitions.bin" \
            0x00E000 "$BOOT_APP0" \
            0x010000 "$BUILD/firmware.bin" \
            0x410000 "$BUILD/littlefs.bin"

      - name: Create release manifest
        run: |
          cat > site/manifest.json <<'EOF'
          {
            "name": "Tiny Engineer S3 External",
            "version": "1.3-s3-n16r8-runtime-servo-limits",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "serialType": "cdc",
                "improv": false,
                "parts": [
                  {
                    "path": "firmware/tiny-engineer-s3-n16r8.factory.bin",
                    "offset": 0
                  }
                ]
              }
            ]
          }
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
