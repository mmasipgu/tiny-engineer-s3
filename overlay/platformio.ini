; Tiny Engineer S3 N16R8 - web-flasher build
[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; N16R8 = 16 MB Quad flash + 8 MB Octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    bblanchon/ArduinoJson@^7.4.3

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D SSD1306_NO_SPLASH
    -D TE_BOARD_ESP32_S3_N16R8=1
    -D TE_RGB_PIN=48

board_build.partitions = partitions_s3.csv
board_build.filesystem = littlefs

custom_audio_mod =

extra_scripts =
    pre:scripts/firmware_version.py
    pre:scripts/copy_assets.py
    pre:scripts/embed_ui.py
    pre:scripts/park_servos_before_upload.py
    post:scripts/upload_fs_after_upload.py

test_ignore = *
